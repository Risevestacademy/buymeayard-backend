# Render Blueprint — Infrastructure as Code
# Docs: https://docs.render.com/blueprint-spec
#
# To use: connect this repo in Render Dashboard → "New Blueprint Instance"
# Render will auto-detect this file and provision the services below.

services:
  # ── API Web Service ──
  - type: web
    name: buymeayard-api
    runtime: docker
    repo: https://github.com/Risevestacademy/buymeayard-backend
    region: frankfurt # closest to West Africa
    branch: main
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: buymeayard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: buymeayard-redis
          type: redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false # set manually after deploy
      - key: APP_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENTAGE
        value: "10"
      - key: DEFAULT_CURRENCY
        value: NGN

  # ── Redis ──
  - type: redis
    name: buymeayard-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal Render services only

# ── PostgreSQL ──
databases:
  - name: buymeayard-db
    plan: starter
    databaseName: buymeayard
    region: frankfurt
    postgresMajorVersion: "16"
