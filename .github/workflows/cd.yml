name: CD — Deploy to Koyeb

on:
  # Only deploy after CI passes on main
  push:
    branches: [main]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel an in-progress deploy

jobs:
  # Gate: run the full CI pipeline first
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Koyeb
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Install Koyeb CLI
        uses: koyeb/install-koyeb-cli@v2

      - name: Trigger redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          koyeb service redeploy buymeayard-api/buymeayard-api

      - name: Deploy triggered
        run: echo "✅ Koyeb redeploy triggered. Check https://app.koyeb.com for build status."
